services:

  frontend:
    image: daavidraamirez/frontend
    ports:
      - 5001:5001
  backend:
    image: daavidraamirez/backend
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:5001

  redis:
    image: redis  